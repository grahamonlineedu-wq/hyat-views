<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyæt Views Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="engine-pill" id="engine-pill" data-state="checking">Checking API…</p>
      <h1>Hyæt Views Engine</h1>
      <p class="subtitle">Heuristic & algorithmic threat detection</p>
      <div class="theme-selector" role="group" aria-label="Theme">
        <button type="button" class="theme-btn active" data-theme="navy">Navy Blue</button>
        <button type="button" class="theme-btn" data-theme="pure-black">Pure Black</button>
        <button type="button" class="theme-btn" data-theme="cyber-violet">Cyber Violet</button>
        <button type="button" class="theme-btn" data-theme="emerald">Emerald Green</button>
      </div>
    </header>

    <div class="mode-selector">
      <button type="button" id="single-mode-btn" class="mode-btn active">Single Scan</button>
      <button type="button" id="batch-mode-btn" class="mode-btn">Batch Scan Mode</button>
    </div>

    <form id="scan-form" class="scan-form">
      <label class="sr-only" for="scan-input">URL or IP address</label>
      <input id="scan-input" type="text" name="url" placeholder="Enter URL or IP address..." autocomplete="off" required />
      <button type="submit" class="btn-primary">Run Deep Scan</button>
    </form>

    <form id="batch-form" class="scan-form" hidden>
      <label class="sr-only" for="batch-input">URLs, one per line</label>
      <textarea id="batch-input" rows="4" placeholder="One URL or IP per line (max 20)"></textarea>
      <button type="submit" class="btn-primary">Run Batch Deep Scan</button>
    </form>

    <section class="metrics" aria-label="Scan results">
      <button type="button" class="metric-card active" id="card-status" data-card="status">
        <h2>Status</h2>
        <p id="status-val" data-tone="ready">READY</p>
      </button>
      <button type="button" class="metric-card" id="card-score" data-card="score">
        <h2>Reputation Score</h2>
        <p id="score-val">100 / 100</p>
      </button>
      <button type="button" class="metric-card" id="card-threats" data-card="flags">
        <h2>Threat Flags</h2>
        <p id="threat-val">0</p>
      </button>
    </section>

    <section id="detail-panel" class="detail-panel" aria-live="polite"></section>

    <div class="action-bar">
      <button type="button" id="download-json-btn" class="btn-secondary">Download JSON Log</button>
      <button type="button" id="copy-summary-btn" class="btn-secondary">Copy Text Summary</button>
    </div>
    <p id="action-note" class="action-note" aria-live="polite"></p>

    <section class="history-section">
      <div class="history-header">
        <h2>Recent scans</h2>
        <button type="button" id="clear-history-btn" class="btn-text">Clear Log</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>

    <p class="disclaimer">Heuristic signal only. A clean score is not proof a page is safe. Do not enter passwords on a flagged link.</p>
  </main>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyæt Views Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-navy">
  <div class="container">
    <header class="header">
      <h1>Hyæt Views Engine</h1>
      <p class="subtitle">Heuristic & Algorithmic Threat Detection</p>
      
      <!-- Theme Selection Bar -->
      <div class="theme-selector">
        <span>Theme:</span>
        <button type="button" class="theme-btn active" data-theme="theme-navy">Navy Blue</button>
        <button type="button" class="theme-btn" data-theme="theme-pure-black">Pure Black</button>
        <button type="button" class="theme-btn" data-theme="theme-cyber">Cyber Violet</button>
        <button type="button" class="theme-btn" data-theme="theme-emerald">Emerald Green</button>
      </div>
    </header>

    <!-- Navigation Mode Switcher -->
    <div class="mode-switcher">
      <button type="button" id="single-mode-btn" class="mode-btn active">Single Scan</button>
      <button type="button" id="batch-mode-btn" class="mode-btn">Batch Scan Mode</button>
    </div>

    <!-- Single Scan Input Form -->
    <form id="scan-form" class="scan-form-container">
      <input type="text" id="scan-input" placeholder="Enter URL or IP address..." required />
      <button type="submit" id="run-scan-btn" class="btn-primary">Run Deep Scan</button>
    </form>

    <!-- Batch Scan Form -->
    <form id="batch-form" class="scan-form-container" style="display: none;">
      <textarea id="batch-input" placeholder="Enter one URL per line..." rows="4"></textarea>
      <button type="submit" id="run-batch-btn" class="btn-primary">Run Batch Deep Scan</button>
    </form>

    <!-- Metric Displays (Interactive Service Cards) -->
    <div class="metrics-grid">
      <div class="metric-card" id="card-status">
        <h3>Status</h3>
        <p id="status-val" class="metric-value">READY</p>
      </div>

      <div class="metric-card" id="card-score">
        <h3>Reputation Score</h3>
        <p id="score-val" class="metric-value">100 / 100</p>
      </div>

      <div class="metric-card" id="card-threats">
        <h3>Threat Flags</h3>
        <p id="threat-val" class="metric-value">0</p>
      </div>
    </div>

    <!-- Export & Copy Actions -->
    <div class="action-bar">
      <button type="button" id="download-json-btn" class="btn-secondary">📥 Download JSON Log</button>
      <button type="button" id="copy-summary-btn" class="btn-secondary">📋 Copy Text Summary</button>
    </div>

    <!-- Scan History Logs -->
    <div class="history-section">
      <div class="history-header">
        <h2>RECENT SCANS</h2>
        <button type="button" id="clear-history-btn" class="btn-danger">Clear Log</button>
      </div>
      <div id="history-list" class="history-list">
        <div style="color: #666666; font-size: 0.85rem; padding: 10px 0;">No scan logs available in this session.</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
